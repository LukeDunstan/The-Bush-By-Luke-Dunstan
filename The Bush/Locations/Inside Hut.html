<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>MMCC3045</title>
    <link href="../Style Sheets/Main.css" rel="stylesheet" />
    <link href="../Style Sheets/Inside-Hut.css" rel="stylesheet" />
    <script src="../JavaScript files/jquery-4.0.0.min.js"></script>
    <script src="../JavaScript files/jquery-ui.js"></script>
    <script src="../JavaScript files/Game_Data.js"></script>
    <script src="../JavaScript files/Game_Helpers.js"></script>
    <script>
        var hasAxe = SearchSlots("axe");
        var iskillerComing = false;
        var KillerTimer;
        var timer;
        var secondsToWait = 5;

        $(document).ready(function () {
            if (localStorage.getItem("killerCame") && !localStorage.getItem("killerDead")) {
                $("#car-battery-fig").append("<img id='car-battery' class='item' src='../Images/car-battery.png'>");
            }

            init();
            $("#back-button").on("click", function () { window.location.href = "../Locations/Outside Hut.html" });

            $(".inventory-slot").one(
                "drop", function (e, ui) {
                    console.log("dropped")
                    if (ui.draggable[0].id == "car-battery") {
                        insertDialogue("Now I can hotwire the car and get out of here", "Joseph");
                        $(".inventory-slot").off("drop");
                    }
                }
            )

            if (CheckIfFirstTime()) {
                if (!SearchSlots("phone") && !localStorage.getItem("isPhoneCharging")) {
                    insertDialogue("Hmm, no one's here", "Josef")
                } else if (SearchSlots("phone") && !localStorage.getItem("isPhoneCharging")) {
                    insertDialogue("Hmm, no one's here. I should really find somewhere to charge my phone", "Josef")
                }
            } else if (localStorage.getItem("cellarUnlocked") && !localStorage.getItem("rangerTalked")) {
                RangerJosefDialogue();
            } else if (localStorage.getItem("unlockFailed") && !localStorage.getItem("killerCame")) {
                KillerComing();
            } else if (localStorage.getItem("breathingSuccess") && !localStorage.getItem("policeTalked")) {
                PostLocker();
            }


            $("#desk").on("click", function () {
                if (SearchSlots("phone")) {
                    insertDialogue("Nice, I can plug my phone in here, *Click*", "Josef");
                    $(".dialogue").one("click", function () {
                        localStorage.setItem("isPhoneCharging", "true");
                        RemoveFromInventory("phone");
                        insertDialogue("What's this?", "Josef");
                        $(".dialogue").one("click", function () {
                            insertNarration("You see a map on the desk detailing your trip with Cody");
                            $(".dialogue").one("click", function () {
                                insertDialogue("How are our plans for the trip are here? Maybe Cody has been here and is looking for me with the Ranger.");
                            })
                        })
                    })
                } else {
                    if (localStorage.getItem("isPhoneCharging")) {
                        if (localStorage.getItem("policeTalked")) {
                            insertDialogue("The police are on their way, I need to go", "Josef");
                        } else if (localStorage.getItem("killerCame")) {
                            PhoneMessages();
                        }
                        else {
                            insertDialogue("Damn the phone hasn't turned on yet, I should look around more", "Josef");
                        }
                    } else {
                        insertDialogue("Oh a charger, this will be handy if my phone needs charging", "Josef");
                    }
                }

            })
            $("#cellar").on("click", function () {
                if (SearchSlots("phone")) {
                    insertDialogue("I should really charge this phone", "Josef");
                } else if (localStorage.getItem("rangerTalked")) {
                    insertDialogue("I already let the ranger out, we need to escape", "Josef");
                } else if (localStorage.getItem("isPhoneCharging")) {
                    insertDialogue("*Thump Thump*... *Muffled pleas for help*", "Cody?");
                    $(".dialogue").one("click", function () {
                        insertDialogue("Cody are you in there?!? I'll try and get this open", "Josef");
                        $(".dialogue").one("click", function () {
                            insertNarration("The doors are locked shut.")
                            $(".dialogue").one("click", function () {
                                if (hasAxe) {
                                    insertDialogue("I can use the axe to break to door, Step back", "Josef", "../Minigames/UnlockCellar.html");
                                } else if (localStorage.getItem("axeBroken")) {
                                    insertDialogue("I'm sorry, I cant open the door!");
                                } else {
                                    insertDialogue("I need something heavy to break the door, there was an axe outside I could use", "Josef");
                                }
                            })
                        })
                    })
                } else {
                    insertDialogue("I should really find my phone", "Josef");
                }
            })
            $("#locker").on("click", function () {
                if (!iskillerComing) {
                    insertDialogue("This could be a useful hiding spot if needed", "Josef");
                } else {
                    clearInterval(KillerTimer);
                    KillerWalksIn();
                }
            })
        })

        function RangerJosefDialogue() {
            insertNarration("you help out the person in the cellar to find they are not Cody but the Ranger of this hut, missing two fingers");
            $(".dialogue").one("click", function () {
                insertDialogue("You're not Cody, who are you?", "Josef");
                $(".dialogue").one("click", function () {
                    insertDialogue("Thank you for rescuing me, I'm the Ranger of this park.", "Ranger");
                    $(".dialogue").one("click", function () {
                        insertDialogue("There is a psycopath canibal loose, he locked me in the cellar after taking two of my fingers for a snack", "Ranger");
                        $(".dialogue").one("click", function () {
                            insertDialogue("Jesus, I knew there was something going on but a canibal? Can you help me find my friend?", "Josef");
                            $(".dialogue").one("click", function () {
                                insertDialogue("Sure thing kid, that's kind of my job", "Ranger");
                                $(".dialogue").one("click", function () {
                                    insertNarration("The Ranger has joined you");
                                    localStorage.setItem("rangerTalked", true);
                                    $(".dialogue").one("click", function () {
                                        KillerComing();
                                    })
                                })
                            })
                        })
                    })
                })

            })
        }

        function KillerWalksIn() {
            localStorage.setItem("killerCame", true);
            insertNarration("A hooded figure walks into the hut and over to the desk, placing a car battery on top and sighing as he takes his hood off revealing... Cody?!");
            $("#car-battery-fig").append("<img id='car-battery' class='item' src='../Images/car-battery.png'>");
            $(".dialogue").one("click", function () {
                if (!localStorage.getItem("cellarUnlocked")) {
                    insertNarration("Cody notices the mess left by Josef looking at the desk.")
                    $(".dialogue").one("click", function () {
                        insertDialogue("Damn he's been here. He's going to cook up nicely when I find him", "Cody");
                        $(".dialogue").one("click", function () {
                            insertNarration("Cody cocks a gun in his hand and sets back out to look for Josef");
                            $(".dialogue").one("click", function () {
                                PostLocker();
                            })
                        })
                    })
                } else {
                    insertNarration("Cody looks toward the cellar, noticing the broken lock.")
                    $(".dialogue").one("click", function () {
                        insertDialogue("Damn he's got out, now I have two meals to look for", "Cody");
                        $(".dialogue").one("click", function () {
                            insertNarration("Cody cocks a gun in his hand and set back outside when he hears a noise coming from the locker");
                            $(".dialogue").one("click", function () {
                                insertDialogue("Still here I see", "Cody");
                                $(".dialogue").one("click", function () {
                                    insertNarration("Cody starts walking over to the locker", "../Minigames/Breathing.html");
                                })
                            })
                        })
                    })
                }
            })
        }

        function KillerComing() {
            insertNarration("*Thump* A car door closes outside");
            $(".dialogue").one("click", function () {
                if (localStorage.getItem("rangerTalked")) {
                    insertDialogue("Quick we need to hide, those lockers should fit us both. We'll need to hold our breath though", "Ranger");
                } else {
                    insertDialogue("Who is that? I should probably hide", "Josef");
                }
                $(".dialogue").one("click", function () {
                    localStorage.setItem("killerCame", true);
                    iskillerComing = true;
                    timer = 0;
                    KillerTimer = setInterval(WalkingTimer, 1000);
                })

            })
        }

        function PostLocker() {
            if (!localStorage.getItem("rangerTalked")) {
                insertDialogue("Oh my god, Cody is the killer? If he's there then who is in the cellar?", "Josef");
                $(".dialogue").one("click", function () {
                    insertNarration("Josef grows anxious, trying to decide if he takes the car battery and leaves the random he doesn't know to die or save them");
                    $(".dialogue").one("click", function () {
                        insertDialogue("I should check if the phone is charged and call the police", "Josef");
                    })
                })
            } else {
                insertDialogue("Oh my god, Cody is the killer?", "Josef");
                $(".dialogue").one("click", function () {
                    insertDialogue("I should check if the phone is charged and call the police", "Josef");
                })
            }
        }

        function PhoneMessages() {
            localStorage.setItem("policeTalked", true);
            insertDialogue("Thank god, the phone has charge. Jeez I have so many messages", "Josef");
            $(".dialogue").one("click", function () {
                insertNarration('Josef looks at the messages: "Do not go with that man!"~Mum, "Police came around asking about Cody.."~Kate, "Bro i just heard Cody is a serial killer named Tobias?"~George');
                $(".dialogue").one("click", function () {
                    insertDialogue("This is so much worse than I thought it was, a serial killer?!?", "Josef");
                    $(".dialogue").one("click", function () {
                        insertDialogue("Okay, call the police", "Josef");
                        $(".dialogue").one("click", function () {
                            insertNarration("Josef dials 000 and gets a hold of the police");
                            $(".dialogue").one("click", function () {
                                insertDialogue("Police, what's the emergency", "Police Line");
                                $(".dialogue").one("click", function () {
                                    if (localStorage.getItem("rangerDead")) {
                                        insertDialogue("Please help I'm at Rosewell park and I killed a man, he killed the Ranger...", "Josef");
                                        $(".dialogue").one("click", function () {
                                            insertDialogue("Ah you're the Josef kid. We have a unit already on the way, you said someone has been killed?", "Police Line");
                                            $(".dialogue").one("click", function () {
                                                insertDialogue("The Ranger is dead, Cody or Tobias whatever his name is killed him.", "Josef");
                                                $(".dialogue").one("click", function () {
                                                    insertDialogue("But I.. I killed the murderer, I thought he was my friend.", "Josef");
                                                    $(".dialogue").one("click", function () {
                                                        insertDialogue("Everything will be okay, sit tight and our unit will be with you soon", "Police Line");
                                                        $(".dialogue").one("click", function () {
                                                            insertNarration("Josef sits on the ground with his knees to his chest and starts sobbing", "../Locations/Ending.html");
                                                        })
                                                    })
                                                })
                                            })
                                        })

                                    } else {
                                        insertDialogue("Please help, I'm at Rosewell park and there is a murderer on the loose", "Josef");
                                        $(".dialogue").one("click", function () {
                                            insertDialogue("Is your name Josef? We have a unit already on the way to Rosewell park", "Police Line");
                                            $(".dialogue").one("click", function () {
                                                insertDialogue("Are you okay? Are you safe?", "Poice Line");
                                                $(".dialogue").one("click", function () {
                                                    insertDialogue("I am just scared, I'm in the Rangers hut but there aren't many places to reliably hide and I think the murderer is using here as their base.", "Josef");
                                                    $(".dialogue").one("click", function () {
                                                        insertDialogue("My car is a little ways away, I think I can reach it and escape the park", "Josef");
                                                        $(".dialogue").one("click", function () {
                                                            insertDialogue("If you think that will be safer for you, get out of there. The police will check up on you at your house later on", "Police Line");
                                                            $(".dialogue").one("click", function () {
                                                                insertDialogue("Okay thank you", "Josef");
                                                                $(".dialogue").one("click", function () {
                                                                    insertNarration("The line hangs up");
                                                                    $(".dialogue").one("click", function () {
                                                                        insertDialogue("I need to go, now.", "Josef");
                                                                    })
                                                                })
                                                            })
                                                        })
                                                    })
                                                })
                                            })
                                        })
                                    }
                                })
                            })
                        })
                    })
                })
            })
        }

        function WalkingTimer() {
            timer += 1;
            if (timer >= secondsToWait) {
                insertDialogue("Aha, I found you", "Unknown");
                $(".dialogue").one("click", function () { window.location.href = "../Locations/Inside Hut-Killer-Event.html"; })
            }
        }
    </script>
</head>

<body>
    <div id="backdrop">
        <div id="stage">
            <figure id="car-battery-fig"></figure>
            <figure id="desk-fig"> <img id="desk" class="clickable" src="../Images/desk.png"></figure>
            <figure id="cellar-fig"> <img id="cellar" class="clickable" src="../Images/cellar-door-cropped.png">
            </figure>
            <figure id="locker-fig"> <img id="locker" class="clickable" src="../Images/locker.png"></figure>
        </div>
    </div>
</body>

</html>
