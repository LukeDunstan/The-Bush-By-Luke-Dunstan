<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>MMCC3045</title>
    <link href="../Style Sheets/Main.css" rel="stylesheet" />
    <link href="../Style Sheets/Outside-Hut.css" rel="stylesheet" />
    <script src="../JavaScript files/jquery-4.0.0.min.js"></script>
    <script src="../JavaScript files/jquery-ui.js"></script>
    <script src="../JavaScript files/Game_Data.js"></script>
    <script src="../JavaScript files/Game_Helpers.js"></script>
    <script>
        $(document).ready(function () {
            init();

            //scene setup based on previous actions
            if (CheckIfFirstTime()) {
                if (!SearchSlots("axe")) {
                    insertDialogue("Odd to have an axe by the door. With how our campsite looked, maybe it will be of use to me", "Josef");
                }
            }

            if (localStorage.getItem("unlockFailed")){
                $("#axe-fig").hide();
            }

                $("#back-button").on("click", function () { window.location.href = "../Locations/Clearing.html" })

            //inside hut connection
            $("#ranger-door").on("click", function () { window.location.href = "../Locations/Inside Hut.html" })

        })
    </script>
</head>

<!-- html -->

<body>
    <div id="backdrop">
        <div id="stage">
            <figure id="axe-fig"> <img class="item" id="axe" src="../Images/axe.png">
            </figure>
            <figure id="ranger-door-fig"> <img class="clickable" id="ranger-door" src="../Images/Ranger-door.png">
            </figure>
        </div>
    </div>
</body>

</html>
