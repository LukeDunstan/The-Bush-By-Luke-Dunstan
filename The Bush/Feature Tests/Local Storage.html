<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MMCC3045</title>
<link href="../Style Sheets/Main.css" rel="stylesheet" />
<link href="../Style Sheets/Tester.css" rel="stylesheet" />
<script src="../jquery-4.0.0.min.js"></script>
<script src="../jquery-ui.js"></script>
<script src="./Game_Data.js"></script>
<script>
$(document).ready(function() { 

    var item = localStorage.getItem("slot1-item");
    console.log (item)

    $(".item").draggable({
        revert: function(){
            if (this.parent() == $(".inventory-slot")){
                this.addClass("in-inventory");
                return true;
            }
            return true;

        },
        containment: 'parent',
        start: function (e, ui) {
            $("#" + e.currentTarget.id).removeClass("in-inventory")
            // $("#" + e.currentTarget.id).prependTo($("#stage"))
        }
    })

    $(".inventory-slot").droppable({
        accept: ".item",
        drop: function (e, ui) {
            console.log(e.target.id)
            ui.draggable.appendTo($(e.target))
            ui.draggable.addClass("in-inventory");

        }
    })


})
</script>
</head>
<body>
    <div id= "stage"> 
         <!-- <img class="item" id="test-img" src="../Images/old-rust-dirty-dark-gray-ax-with-brown-wooden-handle-isolated-with-clipping-path-in-format-png.png"> -->

        <div class="inventory"> 
            <div class= "inventory-slot" id="slot1">  </div>
            <div class= "inventory-slot" id="slot2"> </div>
            <div class= "inventory-slot" id="slot3"> </div>
            <div class= "inventory-slot" id="slot4"> </div>

        </div>
    </div>
</body>
</html>
