<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Breathing Minigame Test</title>
    <link href="" rel="stylesheet" />
    <script src="../jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function () {
            var isKeyDown = false;
            var keyCode = 69;
            var tooLongTreshold = 4.00 // seconds
            var minigameLength = 10.00;
            var timer = 0.00;
            var timerInterval;

            $(document).one('keydown', EDown);
            


            function EDown(event) {
                if (event.keyCode == keyCode) {
                    clearInterval(timerInterval);
                    $(document).one('keyup', EUp);
                    if (timer < 0) {
                        timer = 0;
                        timerInterval = setInterval(AddTimer, 100);
                    } else {
                        timerInterval = setInterval(AddTimer, 100);
                    }
                } else {
                    $(document).one('keydown', EDown);
                }
            }

            function EUp(event) {
                if (event.keyCode == keyCode) {
                    $(document).one('keydown', EDown);
                    clearInterval(timerInterval);
                    timerInterval = setInterval(ReduceTimer, 100);
                } else {
                    $(document).one('keyup', EUp);
                }
            }

            function AddTimer() {
                timer += 0.10001;
            }

            function ReduceTimer() {
                if (timer > 0) {
                    timer -= 0.10001;
                } else {
                    clearInterval(timerInterval);
                }
            }

            setInterval(function () {
                if (timer < tooLongTreshold/3){
                    $("body").css("background-color", "green");
                } else if (timer > tooLongTreshold/3 && timer < (2*tooLongTreshold/3)) {
                    $("body").css("background-color", "orange");
                } else if (timer > (2*tooLongTreshold/3)) {
                    $("body").css("background-color", "red");
                }
                console.log(timer);
            })


        })
    </script>
</head>

<body>
    <div class= stage>

    </div>
</body>

</html>
