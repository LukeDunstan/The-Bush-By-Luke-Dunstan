<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>The Bush by Luke Dunstan</title>
    <link href="./Style Sheets/Main.css" rel="stylesheet" />
    <link href="./Style Sheets/index.css" rel="stylesheet" />
    <script src="./JavaScript files/jquery-4.0.0.min.js"></script>
    <script src="./JavaScript files/jquery-ui.js"></script>
    <script src="./JavaScript files/Game_Data.js"></script>
    <script src="./JavaScript files/Game_Helpers.js"></script>
    <script>
        $(document).ready(function () {

            //start game
            $("#start").on("click", function () {
                window.location.href = './Locations/Prologue.html';
            })

            //clear localstorage for fresh playthrough
            $("#reset").on("click", function () {
                localStorage.clear();
            })

        })
    </script>
</head>

<!-- html -->
<body>
    <div id="backdrop">
        <div id="stage">
            <h1> The Bush </h1>
            <button id="start"> Start</button>
            <button id="reset"> Reset Progress</button>
        </div>
    </div>
</body>

</html>
