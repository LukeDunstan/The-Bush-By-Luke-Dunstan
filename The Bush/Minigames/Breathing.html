<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Breathing Minigame Test</title>
    <link href="../Style Sheets/Main.css" rel="stylesheet"/>
    <link href="../Style Sheets/Breathing.css" rel="stylesheet" />
    <script src="../JavaScript files/jquery-4.0.0.min.js"></script>
    <script src="../JavaScript files/jquery-ui.js"></script>
    <script>
        $(document).ready(function () {
            var isKeyDown = false;
            var keyCode = 69;
            var tooLongTreshold = 4.00 // seconds
            var minigameLength = 10.00;
            var timer = 0.00;
            var timerInterval;
            var stage;


            $(document).one('keydown', EDown);

            function EDown(event) {
                if (event.keyCode == keyCode) {
                    clearInterval(timerInterval);
                    $(document).one('keyup', EUp);
                    if (timer < 0) {
                        timer = 0;
                        timerInterval = setInterval(AddTimer, 100);
                    } else {
                        timerInterval = setInterval(AddTimer, 100);
                    }
                } else {
                    $(document).one('keydown', EDown);
                }
            }

            function EUp(event) {
                if (event.keyCode == keyCode) {
                    $(document).one('keydown', EDown);
                    clearInterval(timerInterval);
                    timerInterval = setInterval(ReduceTimer, 100);
                } else {
                    $(document).one('keyup', EUp);
                }
            }

            function AddTimer() {
                timer += 0.10001;
            }

            function ReduceTimer() {
                if (timer > 0) {
                    timer -= 0.10001;
                } else {
                    clearInterval(timerInterval);
                }
            }

            setInterval(function () {
                if (timer < tooLongTreshold / 3) {
                    stage = 1
                } else if (timer > tooLongTreshold / 3 && timer < (2 * tooLongTreshold / 3)) {
                    stage = 2;
                } else if (timer > (2 * tooLongTreshold / 3)) {
                    stage = 3;
                }
            })
        })
    </script>
</head>

<body>
    <div id="backdrop">
        <div class=stage>

        </div>
        <div class="ui">
            <div id="bar">
                <div id="red1"></div>
                <div id="green"></div>
                <div id="red2"></div>
            </div>
        </div>
    </div>
</body>

</html>
