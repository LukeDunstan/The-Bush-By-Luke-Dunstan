<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Breathing Minigame Test</title>
    <link href="../Style Sheets/Main.css" rel="stylesheet" />
    <link href="../Style Sheets/Unlock-Cellar.css" rel="stylesheet" />
    <script src="../JavaScript files/jquery-4.0.0.min.js"></script>
    <script src="../JavaScript files/jquery-ui.js"></script>
    <script src="../JavaScript files/Game_Helpers.js"> </script>
    <script>
        $(document).ready(function () {
            var isKeyDown = false;
            var keyCode = 32;
            var minPos = "-4";
            var maxPos = "95";
            var timer = 0.00;
            var timerInterval;
            var speed = 500;
            var axeIconElement = $("#axe-icon");
            var axePosPercent;
            var goingUp = true;
            var strikes = 0;


            InitDialogueBox();
            setInterval(MoveAxe, 1)
            $(document).on('keydown', hit);

            function hit(e) {
                if (e.keyCode == keyCode) {
                    if (axePosPercent > 35 && axePosPercent < 55) {
                        localStorage.setItem("cellarUnlocked", true);
                        insertNarration("*CRASH* the lock broke!", "../Locations/Inside Hut.html");
                    } else {
                        strikes = strikes + 1;
                    }
                }

                if (strikes > 2) {
                    if (!localStorage.getItem("unlockFailed")) {
                        localStorage.setItem("unlockFailed", true);
                        insertNarration("*Thump* A car door closes outside", "../Locations/Inside Hut.html");
                    } else {
                        insertNarration("*Crack* The axe breaks, leaving Josef with nothing to open the cellar with");
                        $(".dialogue").one("click", function () {
                            insertDialogue("I'm so sorry, I've got to get out of here", "Josef", "../Locations/Inside Hut.html");
                        })
                    }
                }
            }
            function MoveAxe() {
                thisDeltaTime = GetTimeBetweenIntervals();
                axePosPercent = Number(axeIconElement.css("left").substring(0, axeIconElement.css("left").length - 2)) / axeIconElement.parent().width() * 100;
                if (axePosPercent <= minPos) {
                    goingUp = true;
                } else if (axePosPercent >= maxPos) {
                    goingUp = false;
                }

                if (goingUp) {
                    axeIconElement.css("left", Number(axeIconElement.css("left").substring(0, axeIconElement.css("left").length - 2)) + speed * thisDeltaTime);
                } else {
                    axeIconElement.css("left", Number(axeIconElement.css("left").substring(0, axeIconElement.css("left").length - 2)) - speed * thisDeltaTime);
                }
            }
        })
    </script>
</head>

<body>
    <div id="backdrop">
        <div class=stage>
            <h1 class="MG-instructions"> Press "SPACE" when the axe is in the green, you get 3 attempts.</h1>
        </div>
        <div id="bar" class="ui ui1">
            <img id="axe-icon"
                src="../Images/old-rust-dirty-dark-gray-ax-with-brown-wooden-handle-isolated-with-clipping-path-in-format-png.png">
            <div id="red1"></div>
            <div id="green"></div>
            <div id="red2"></div>
        </div>
    </div>
</body>

</html>
