<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Breathing Minigame Test</title>
    <link href="../Style Sheets/Main.css" rel="stylesheet"/>
    <link href="../Style Sheets/Unlock-Cellar.css" rel="stylesheet" />
    <script src="../JavaScript files/jquery-4.0.0.min.js"></script>
    <script src="../JavaScript files/jquery-ui.js"></script>
    <script>
        $(document).ready(function () {
            var isKeyDown = false;
            var keyCode = 32;
            var minPos = "-4";
            var maxPos = "95";
            var timer = 0.00;
            var timerInterval;
            var speed = 3;
            var axeIconElement = $("#axe-icon");
            var axePosPercent;
            var goingUp = true;
            var strikes = 0;
            
            
            
            setInterval(MoveAxe, 1)
            $(document).on('keydown', hit);

            function hit(e){ 
                if(e.keyCode == keyCode){
                    if (axePosPercent > 35 && axePosPercent < 55){
                        console.log("yes");
                    } else {
                        strikes = strikes + 1
                    }
                }

                if (strikes > 2){
                    console.log("failed")
                }
            } 
            function MoveAxe(){
                axePosPercent = Number(axeIconElement.css("left").substring(0,axeIconElement.css("left").length-2))/axeIconElement.parent().width()*100;
                if (axePosPercent <= minPos){
                    goingUp = true;
                } else if (axePosPercent >= maxPos) {
                    goingUp = false;
                }

                if (goingUp){
                    axeIconElement.css("left", Number(axeIconElement.css("left").substring(0,axeIconElement.css("left").length-2)) + speed);
                } else {
                    axeIconElement.css("left", Number(axeIconElement.css("left").substring(0,axeIconElement.css("left").length-2)) - speed);
                }
            }

        //     setInterval(function () {
        //         if (timer < tooLongTreshold / 3) {
        //             stage = 1
        //         } else if (timer > tooLongTreshold / 3 && timer < (2 * tooLongTreshold / 3)) {
        //             stage = 2;
        //         } else if (timer > (2 * tooLongTreshold / 3)) {
        //             stage = 3;
        //         }
        //     })
        })
    </script>
</head>

<body>
    <div id="backdrop">
        <div class=stage>

        </div>
        <div class="ui">
            <div id="bar">
                <img id="axe-icon" src="../Images/old-rust-dirty-dark-gray-ax-with-brown-wooden-handle-isolated-with-clipping-path-in-format-png.png">
                <div id="red1"></div>
                <div id="green"></div>
                <div id="red2"></div>
            </div>
        </div>
    </div>
</body>

</html>
