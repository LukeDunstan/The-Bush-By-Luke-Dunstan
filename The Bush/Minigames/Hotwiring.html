<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>MMCC3045</title>
    <link href="../Style Sheets/Main.css" rel="stylesheet" />
    <link href="../Style Sheets/HotWiring.css" rel="stylesheet" />
    <script src="../JavaScript files/jquery-4.0.0.min.js"></script>
    <script src="../JavaScript files/Game_Helpers.js"></script>
    <script src="../JavaScript files/jquery-ui.js"></script>
    <script>
        var thisDeltaTime;
        var secondsTilDeath = 10;
        var timer = 0;
        var gameInterval;

        var carStart = new Audio(Sounds.carStart);

        $(document).ready(function () {
            InitDialogueBox()
            
            insertNarration("Connect the correct wires to complete the circuit and turn on the car before Cody catches you")
            $(".dialogue").one("click", function () {
                gameInterval = setInterval(MainLoop, 100);
                HotwiringDraw();
            })
        })

        function MainLoop() {
            thisDeltaTime = GetTimeBetweenIntervals();
            timer += 1 * thisDeltaTime;
            console.log("deltaTime: " + thisDeltaTime);
            console.log("timer: " + timer);
            if (timer >= secondsTilDeath) {
                localStorage.setItem("deathRespawn", window.location.href);
                clearInterval(gameInterval);
                insertDialogue("You'll never escape me", "Cody", "../Locations/Death.hmtl");
            }
        }

        function HotwiringDraw() {
            $("svg").attr("height", $(".stage").height());
            $("svg").attr("width", $(".stage").width());

            var powerXInitial = GetNumberFromPXAttr("power-line-end", "left");
            var powerYInitial = GetNumberFromPXAttr("power-line-end", "top");
            var ignitionXInitial = GetNumberFromPXAttr("ignition-line-end", "left");
            var ignitionYInitial = GetNumberFromPXAttr("ignition-line-end", "top");
            var powerConnected = false;
            var ignitionConnected = false;
            SetLinePos("ignition-line", ignitionXInitial, ignitionYInitial, GetNumberFromPXAttr("ignition-line-end", "left"), GetNumberFromPXAttr("ignition-line-end", "top"));
            SetLinePos("power-line", powerXInitial, powerYInitial, GetNumberFromPXAttr("power-line-end", "left"), GetNumberFromPXAttr("power-line-end", "top"));

            $(".end").draggable({
                drag: function (e, ui) {
                    SetLinePos("ignition-line", ignitionXInitial, ignitionYInitial, GetNumberFromPXAttr("ignition-line-end", "left"), GetNumberFromPXAttr("ignition-line-end", "top"));
                    SetLinePos("power-line", powerXInitial, powerYInitial, GetNumberFromPXAttr("power-line-end", "left"), GetNumberFromPXAttr("power-line-end", "top"));
                },
                containment: "parent"
            });

            $(".start").droppable({
                drop: function (e, ui) {
                    if (e.target.id.substring(0, 5) == ui.draggable[0].id.substring(0, 5)) {
                        if (e.target.id.includes("power")) {
                            powerConnected = true;
                        } else if (e.target.id.includes("ignition")) {
                            ignitionConnected = true;
                        }
                    }
                    if (powerConnected && ignitionConnected) {
                        clearInterval(gameInterval);
                        BothConnected();
                    }
                },
                accept: ".end"
            })
        }

        function BothConnected() {
            carStart.play();
            insertDialogue("Sweet it started! Let's get out of here", "Josef", "../Locations/Ending.html");
        }

        function SetLinePos(lineID, xStart, yStart, xEnd, yEnd) {
            $("#" + lineID).attr("x1", xStart + 40);
            $("#" + lineID).attr("y1", yStart + 18);
            $("#" + lineID).attr("x2", xEnd + 30);
            $("#" + lineID).attr("y2", yEnd + 18);
        }

        function GetNumberFromPXAttr(selector, attr) {
            return Number($("#" + selector).css(attr).substring(0, $("#" + selector).css(attr).length - 2));
        }
    </script>
</head>

<body>
    <div id="backdrop">
        <img id="hub" src="../Images/hotwire background.png">
        <div class=stage style="position: relative;">
            <svg height="0" width="0" style="position: absolute;">
                <line x1="0" y1="0" x2="0" y2="0" style="stroke:red;stroke-width:14" id="power-line"></line>
                <line x1="0" y1="0" x2="0" y2="0" style="stroke:#0000ff;stroke-width:14" id="ignition-line">
                </line>

            </svg>
            <figure id="power-line-start" class="plug-fig start"> <img class="plug" src="../Images/red connector.png">
            </figure>
            <figure id="power-line-end" class="plug-fig end"> <img class="plug" src="../Images/red connector.png">
            </figure>
            <figure id="ignition-line-start" class="plug-fig start"> <img class="plug" src="../Images/blue connector.png">
            </figure>
            <figure id="ignition-line-end" class="plug-fig end"> <img class="plug" src="../Images/blue connector.png">
            </figure>
        </div>
    </div>
</body>

</html>
